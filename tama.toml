[project]
name = "tamago"
verity = "9eaf64218be14b59f6253219c111a5abf958e7b7"

[paths]
src = "verity/src"
spec = "verity/spec"
proof = "verity/proof"
mirror_test = "test/verity"
out = "artifacts"
generated_solidity = "src/generated/verity"

[modules]
src = "Tamago"
spec = "Tamago.Spec"
proof = "Tamago.Proof"

[yul]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
yul_optimizer = true
evm_version = "cancun"
metadata_bytecode_hash = "none"

[trust.allow_axioms]
"Classical.choice" = "Lean standard classical reasoning accepted for this project"
"propext" = "Lean standard propositional extensionality accepted for this project"
"Quot.sound" = "Lean quotient soundness accepted for this project"
"Lean.ofReduceBool" = "FixedPointMathLib finite-domain proof obligations use native_decide; this trusts Lean native boolean reduction for bounded arithmetic witnesses"
"erc20_transfer_interface" = "ERC4626 and SafeTransferLib use Verity's ERC-20 safeTransfer ECM and assume the target token implements transfer(address,uint256) with standard or optional-bool ERC-20 behavior"
"erc20_transferFrom_interface" = "ERC4626 and SafeTransferLib use Verity's ERC-20 safeTransferFrom ECM and assume the target token implements transferFrom(address,address,uint256) with standard or optional-bool ERC-20 behavior"
"erc20_approve_interface" = "SafeTransferLib uses Verity's ERC-20 safeApprove ECM and assumes the target token implements approve(address,uint256) with standard or optional-bool ERC-20 behavior"
"native_eth_transfer_interface" = "WETH uses a named ECM for native ETH value transfer and assumes EVM call-value semantics for the compiled helper"
"self_address_interface" = "ERC4626 uses a named ECM for address() and assumes it returns the current contract address"

[trust.allow_surfaces]
"selfBalance" = "WETH's withdraw and internal_withdraw read the contract's own ETH balance (SELFBALANCE) as a partially modeled runtime introspection surface; this trusts that the EVM reports the live native balance for the withdrawal accounting"
