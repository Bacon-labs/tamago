[project]
name = "tamago"
verity = "222d13fb232c18936fde757d150d4fa93048863e"

[paths]
src = "verity/src"
spec = "verity/spec"
proof = "verity/proof"
mirror_test = "test/verity"
out = "artifacts"
generated_solidity = "src/generated/verity"

[modules]
src = "Tamago"
spec = "Tamago.Spec"
proof = "Tamago.Proof"

[yul]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
yul_optimizer = true
evm_version = "cancun"
metadata_bytecode_hash = "none"

[trust.allow_axioms]
"Classical.choice" = "Lean standard classical reasoning accepted for this project"
"propext" = "Lean standard propositional extensionality accepted for this project"
"Quot.sound" = "Lean quotient soundness accepted for this project"
"Lean.ofReduceBool" = "FixedPointMathLib finite-domain proof obligations use native_decide; this trusts Lean native boolean reduction for bounded arithmetic witnesses"
"erc20_transfer_interface" = "ERC4626 uses Verity's ERC-20 safeTransfer ECM and assumes the configured asset implements transfer(address,uint256) with standard or optional-bool ERC-20 behavior"
"erc20_transferFrom_interface" = "ERC4626 uses Verity's ERC-20 safeTransferFrom ECM and assumes the configured asset implements transferFrom(address,address,uint256) with standard or optional-bool ERC-20 behavior"
"native_eth_transfer_interface" = "WETH uses a named ECM for native ETH value transfer and assumes EVM call-value semantics for the compiled helper"
"self_address_interface" = "ERC4626 uses a named ECM for address() and assumes it returns the current contract address"
